<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>iPhone 16 Pro Max por dentro · reel</title>
<style>
  :root { --accent: #ffb45e; --ink: #f3f4f6; --muted: rgba(255,255,255,.62); }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #07080b; color: var(--ink);
    font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  #bg { position: absolute; inset: 0;
    background: radial-gradient(ellipse 85% 55% at 50% 44%, #272b37 0%, #14161c 55%, #07080b 100%); }
  #bg::after { content: ''; position: absolute; inset: 0;
    background: radial-gradient(ellipse 60% 25% at 50% 100%, rgba(255,180,94,.08), transparent 70%); }
  canvas { position: absolute; inset: 0; }
  #ov { position: absolute; inset: 0; pointer-events: none; }

  #hud { position: absolute; left: 0; right: 0; top: 140px; text-align: center; font: 600 24px/1 Inter;
    letter-spacing: .22em; text-transform: uppercase; color: rgba(255,255,255,.55); }
  #hud b { color: #fff; font-weight: 700; }
  #dots { position: absolute; left: 0; right: 0; top: 186px; display: flex; justify-content: center; gap: 10px; }
  #dots span { width: 34px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.16); }
  #dots span.on { background: var(--accent); }

  #head { position: absolute; left: 60px; right: 60px; top: 262px; text-align: center; }
  #head .k { font: 700 26px/1 Inter; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); }
  #head h1 { font: 800 92px/1 'Inter Display', Inter; letter-spacing: -.035em; margin: 18px 0 0; }
  #head .pill { display: inline-block; margin-top: 24px; font: 700 32px/1 Inter; padding: 15px 28px; border-radius: 999px;
    background: rgba(255,180,94,.14); border: 1.5px solid rgba(255,180,94,.55); color: #ffd6a6; }

  #cap { position: absolute; left: 50px; right: 50px; top: 1290px; text-align: center; font: 800 70px/1.22 'Inter Display', Inter;
    letter-spacing: -.015em; }
  #cap span { display: inline-block; margin: 0 9px; padding: 2px 14px; border-radius: 16px; color: rgba(255,255,255,.28);
    text-shadow: 0 4px 24px rgba(0,0,0,.55); transition: none; }
  #cap span.said { color: #fff; }
  #cap span.now { color: #17110a; background: var(--accent); text-shadow: none; }

  #fade { position: absolute; inset: 0; background: #000; }
</style>
</head>
<body>
<div id="bg"></div>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="ov">
  <div id="hud"><b>Por dentro</b> · iPhone 16 Pro Max</div>
  <div id="dots"></div>
  <div id="head"><div class="k"></div><h1></h1><div class="pill"></div></div>
  <div id="cap"></div>
  <div id="fade"></div>
</div>
<script type="importmap">
  { "imports": { "three": "./node_modules/three/build/three.module.js",
                 "three/addons/": "./node_modules/three/examples/jsm/" } }
</script>
<script type="module" src="./reel.js"></script>
</body>
</html>
